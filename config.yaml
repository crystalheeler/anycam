name: "AnyCam"
description: "Scans the local network for IP cameras (RTSP, ONVIF, MJPEG, HLS, RTMP, WebRTC, WS-RTSP) and displays live feeds in a card grid."
version: "2.6.0-rc1.0"
slug: "camera_discovery"
init: false
host_network: true
arch:
  - aarch64
  - amd64

options:
  low_fps_mode: false
  skip_nonref: false
  limit_threads: false
  stagger_polling: false
  hw_decode: false
  adaptive_quality: true
  recordings_path: "/media/anycam"
  motion_sensitivity: 15
  motion_cooldown_secs: 10
  motion_clip_padding_secs: 3
  unrestricted_storage_browser: false
  log_debug: true
  log_info: true
  log_warning: true
  log_error: true

schema:
  low_fps_mode: bool
  skip_nonref: bool
  limit_threads: bool
  stagger_polling: bool
  hw_decode: bool
  adaptive_quality: bool
  recordings_path: str
  motion_sensitivity: "int(1,100)"
  motion_cooldown_secs: "int(1,300)"
  motion_clip_padding_secs: "int(0,30)"
  unrestricted_storage_browser: bool
  log_debug: bool
  log_info: bool
  log_warning: bool
  log_error: bool

map:
  - type: media
    read_only: false

boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
full_access: true
panel_icon: mdi:cctv
panel_title: AnyCam
homeassistant_api: false
changelog: CHANGELOG.md
