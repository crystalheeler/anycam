name: "AnyCam"
description: "Scans the local network for IP cameras (RTSP, ONVIF, MJPEG, HLS, RTMP, WebRTC, WS-RTSP) and displays live feeds in a card grid."
version: "3.0.1-rc1.0"
slug: "camera_discovery"
init: false
host_network: true
arch:
  - aarch64
  - amd64

options:
  hw_decode: false
  adaptive_quality: true
  low_latency: false
  global_recording_settings: false
  recordings_path: "/media/anycam"
  motion_detect_level: 63
  motion_clip_length: "30s"
  motion_cooldown_secs: 5
  motion_clip_padding_secs: 3
  unrestricted_storage_browser: false
  log_debug: true
  log_info: true
  log_warning: true
  log_error: true

schema:
  hw_decode: bool
  adaptive_quality: bool
  low_latency: bool
  global_recording_settings: bool
  recordings_path: str
  motion_detect_level: "int(1,100)"
  motion_clip_length: "list(10s|20s|30s|1min|2min|5min)"
  motion_cooldown_secs: "int(1,300)"
  motion_clip_padding_secs: "int(0,30)"
  unrestricted_storage_browser: bool
  log_debug: bool
  log_info: bool
  log_warning: bool
  log_error: bool

map:
  - type: media
    read_only: false

boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
full_access: true
panel_icon: mdi:cctv
panel_title: AnyCam
homeassistant_api: true
changelog: CHANGELOG.md
